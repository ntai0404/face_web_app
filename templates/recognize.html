<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Nhận diện khuôn mặt</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f8ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 30px 50px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 600px;
        width: 100%;
      }
      h2 {
        color: #004aad;
      }
      button {
        background-color: #007bff;
        color: white;
        padding: 12px 20px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #0056b3;
      }
      input[type="file"] {
        margin: 20px 0;
        font-size: 16px;
      }
      img {
        margin-top: 20px;
        max-width: 100%;
        max-height: 400px;
        object-fit: contain;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      .back {
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
        display: inline-block;
        margin-top: 15px;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      li {
        margin: 5px 0;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Nhận diện khuôn mặt</h2>

      <form method="POST" action="/recognize" enctype="multipart/form-data">
        <label><strong>Chọn ảnh:</strong></label><br />
        <input type="file" name="image" accept="image/*" required /><br />
        <button type="submit">Nhận diện</button>
      </form>

      {% if result_image %}
      <h3>Kết quả:</h3>
      <img src="{{ url_for('static', filename='uploads/result.jpg') }}" alt="Kết quả nhận diện" />

      {% if distances %}
      <ul>
        {% for item in distances %}
        <li>{{ item }}</li>
        {% endfor %}
      </ul>
      {% endif %}
      {% endif %}

      <a class="back" href="{{ url_for('index') }}">← Trở về trang chủ</a>
    </div>
  </body>
</html>
